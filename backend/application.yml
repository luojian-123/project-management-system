spring:
  application:
    name: pms-backend
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# 图数据库 Neo4j（替代 MySQL）
neo4j:
  uri: bolt://localhost:7687
  username: neo4j
  password: ${NEO4J_PASSWORD:neo4j123}

# 千人并发：Tomcat 线程与连接调优
server:
  port: 8080
  address: 0.0.0.0
  servlet:
    context-path: /api
  tomcat:
    threads:
      max: 400
    accept-count: 200
    max-connections: 10000

# JWT
jwt:
  secret: pms-jwt-secret-key-at-least-256-bits-for-hs256-please-change-in-production
  expiration-ms: 86400000

# 金蝶集成（预留，请勿将真实密钥提交到代码库）
# 使用前需确认金蝶产品、开放接口文档及鉴权方式
kingdee:
  enabled: false
  base-url: https://your-kingdee-domain.com
  app-id: ""
  app-secret: ""
  # 可选：数据中心 ID、语言等，按金蝶云·星空等产品文档填写
  # acct-id: ""
  # lcid: 2052
